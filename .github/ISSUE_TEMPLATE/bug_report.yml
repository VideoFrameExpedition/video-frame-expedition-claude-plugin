name: Bug report · Signaler un bug
description: The plugin or its skill does not work as described in the README. · Le plugin ou son skill ne marche pas comme le décrit le README.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public: remove any personal information (names, paths containing your user name, addresses, access tokens) before sending. A security flaw is reported privately, from the "Security" tab. A problem of the application itself belongs to [its repository](https://github.com/VideoFrameExpedition/video-frame-expedition-resolve/issues).

        Les issues sont publiques : retirez toute information personnelle (noms, chemins contenant votre nom d'utilisateur, adresses, jetons d'accès) avant d'envoyer. Une faille de sécurité se signale en privé, depuis l'onglet « Security ». Un problème de l'application elle-même se signale dans [son dépôt](https://github.com/VideoFrameExpedition/video-frame-expedition-resolve/issues).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? · Que s'est-il passé ?
      description: What you asked Claude, what you expected, what you got. · Ce que vous avez demandé à Claude, ce que vous attendiez, ce que vous avez obtenu.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions · Versions
      description: Plugin, Video Frame Expedition for DaVinci Resolve, Claude Code, DaVinci Resolve Studio, and the system (Windows or macOS). · Plugin, Video Frame Expedition for DaVinci Resolve, Claude Code, DaVinci Resolve Studio, et le système (Windows ou macOS).
      placeholder: plugin 1.1.0, application 1.1.1, Claude Code 2.1, Resolve Studio 21.1.1, macOS 15.6
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message · Message d'erreur
      description: The message shown, if any, and the output of `claude mcp list`. · Le message affiché, s'il y en a un, et la sortie de `claude mcp list`.
      render: text
